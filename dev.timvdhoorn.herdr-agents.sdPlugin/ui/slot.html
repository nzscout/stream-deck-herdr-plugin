<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Slot">
      <sdpi-select setting="slotIndex" default="0">
        <option value="0">Slot 1</option>
        <option value="1">Slot 2</option>
        <option value="2">Slot 3</option>
        <option value="3">Slot 4</option>
        <option value="4">Slot 5</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Display">
      <sdpi-select setting="display" default="project">
        <option value="project">Project</option>
        <option value="title">Terminal title</option>
      </sdpi-select>
    </sdpi-item>
    <!-- Connection settings are global: shared by every key of this plugin.
         Remote mode forwards herdr's Unix socket over ssh, which needs a POSIX
         host: on Windows the fields are removed (see the script at the end). -->
    <sdpi-item label="SSH remote" data-posix-only>
      <sdpi-textfield
        setting="sshTarget"
        global
        placeholder="user@host - leave empty for local herdr"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Remote socket" data-posix-only>
      <sdpi-textfield
        setting="remoteSocketPath"
        global
        placeholder="~/.config/herdr/herdr.sock (default)"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="" data-posix-only>
      <p style="margin: 0; font-size: 8pt; color: #969696">
        Remote needs key-based SSH (no password prompt):
        <code>ssh -o BatchMode=yes &lt;target&gt; 'echo ok'</code> must print
        "ok". See README &rsaquo; Remote herdr over SSH.
      </p>
    </sdpi-item>
    <sdpi-item label="Terminal">
      <p style="margin: 0; font-size: 8pt; color: #969696">
        Windows: a key press raises the terminal that hosts herdr. Set
        <code>HERDR_DECK_TERMINAL_APP</code> (e.g.
        <code>WindowsTerminal</code>) to override the detected one.
      </p>
    </sdpi-item>
    <script>
      // The Remote fields only make sense where herdr's Unix socket can be
      // forwarded over ssh.
      if (navigator.userAgent.indexOf("Windows") !== -1) {
        document.querySelectorAll("[data-posix-only]").forEach(function (el) {
          el.remove();
        });
      }
    </script>
  </body>
</html>
