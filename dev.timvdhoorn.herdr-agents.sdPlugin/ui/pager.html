<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <!-- The pager pages and jumps within one herdr server; these pick which one
         for this key. Same fields as an Agent Slot key, minus slot/display. -->
    <sdpi-item label="herdr" data-windows-only>
      <sdpi-select setting="source" default="local">
        <option value="local">This PC (Windows)</option>
        <option value="wsl">WSL</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="WSL distro" data-windows-only>
      <sdpi-textfield
        setting="wslDistro"
        placeholder="Ubuntu (leave empty for the default distro)"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="SSH remote" data-posix-only>
      <sdpi-textfield
        setting="sshTarget"
        placeholder="user@host - leave empty for local herdr"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Remote socket" data-posix-only>
      <sdpi-textfield
        setting="remoteSocketPath"
        placeholder="~/.config/herdr/herdr.sock (default)"
      ></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Window" data-windows-only>
      <sdpi-select
        setting="termWindow"
        datasource="terminalWindows"
        placeholder="Auto (detected)"
        loading="Looking for terminal windows..."
        hot-reload
      ></sdpi-select>
    </sdpi-item>
    <sdpi-item label="Tab" data-windows-only>
      <sdpi-select setting="termTab" default="">
        <option value="">Leave active tab</option>
        <option value="1">Tab 1</option>
        <option value="2">Tab 2</option>
        <option value="3">Tab 3</option>
        <option value="4">Tab 4</option>
        <option value="5">Tab 5</option>
        <option value="6">Tab 6</option>
        <option value="7">Tab 7</option>
        <option value="8">Tab 8</option>
        <option value="9">Tab 9</option>
      </sdpi-select>
    </sdpi-item>
    <script>
      customElements.whenDefined("sdpi-select").then(function () {
        var sel = document.querySelector('sdpi-select[setting="termWindow"]');
        if (!sel || typeof sel.refresh !== "function") return;
        [1500, 4000].forEach(function (ms) {
          setTimeout(function () { sel.refresh(); }, ms);
        });
      });

      var onWindows = navigator.userAgent.indexOf("Windows") !== -1;
      document.querySelectorAll(onWindows ? "[data-posix-only]" : "[data-windows-only]").forEach(function (el) {
        el.remove();
      });
    </script>
  </body>
</html>
